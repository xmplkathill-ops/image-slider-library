<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Image Slider Library</title>
    <link rel="stylesheet" href="style.css" />
    <script src="slider.js" defer></script>
  </head>
  <body>
    <main class="page">
      <header class="page__header">
        <h1>Image Slider Library</h1>
        <p>A modular, responsive carousel built with vanilla JavaScript.</p>
      </header>

      <section
        class="slider"
        data-slider
        aria-roledescription="carousel"
        aria-label="Nature gallery"
      >
        <div class="slider__viewport">
          <div class="slider__track">
            <figure class="slider__slide">
              <img
                src="https://picsum.photos/id/1015/1600/900"
                alt="River flowing through a mountain valley"
              />
              <figcaption>Mountain Valley</figcaption>
            </figure>
            <figure class="slider__slide">
              <img
                src="https://picsum.photos/id/1018/1600/900"
                alt="Green hills under a cloudy sky"
              />
              <figcaption>Rolling Hills</figcaption>
            </figure>
            <figure class="slider__slide">
              <img
                src="https://picsum.photos/id/1039/1600/900"
                alt="Waterfall surrounded by forest"
              />
              <figcaption>Forest Waterfall</figcaption>
            </figure>
            <figure class="slider__slide">
              <img
                src="https://picsum.photos/id/1043/1600/900"
                alt="Calm lake at the edge of a forest"
              />
              <figcaption>Quiet Lake</figcaption>
            </figure>
            <figure class="slider__slide">
              <img
                src="https://picsum.photos/id/1044/1600/900"
                alt="Rocky coastline at sunset"
              />
              <figcaption>Coastal Sunset</figcaption>
            </figure>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
